name: enterprise-it-rag

services:
  app:
    image: enterprise-it-rag:local
    build:
      context: .
      target: runtime
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - runtime-data:/app/runtime
      - uploads-data:/app/uploads
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  runtime-data:
  uploads-data:
